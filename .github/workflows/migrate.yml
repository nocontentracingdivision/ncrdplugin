name: Migrate public release packages
on:
  push:
    paths: ['migration.py', '.github/workflows/migrate.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests
      - run: python migration.py
        env:
          GH_TOKEN: ${{ github.token }}
